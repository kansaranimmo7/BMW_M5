<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIDNIGHT BEAST | BMW M5</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

</head>

<body>

    <div class="intro-screen" id="introScreen">

        <div class="intro-light blue-light"></div>
        <div class="intro-light red-light"></div>

        <div class="intro-content">

            <p class="intro-small">THE NIGHT BELONGS TO THE BOLD</p>

            <h1>MIDNIGHT <span>BEAST</span></h1>

            <div class="intro-line"></div>

            <p class="intro-bottom">BMW M5 • PERFORMANCE REDEFINED</p>

        </div>

        <p class="intro-loading">INITIALIZING EXPERIENCE...</p>

    </div>

    <div class="loader" id="loader">

        <h1>BMW M5</h1>

        <p>PREPARING THE BEAST...</p>

    </div>

    <header>

        <div class="logo">BMW</div>

    </header>


    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="subtitle">
                    RED BULL RACING INSPIRED EDITION
                </p>

                <h1>
                    BMW <span>M5</span>
                </h1>

                <p class="description">
                    BEYOND LIMITS. BEYOND ORDINARY.
                </p>

                <button id="exploreBtn">
                    EXPLORE THE MACHINE →
                </button>

            </div>


            <div id="car-container"></div>


            <div class="bottom-text">

                <span>BUILT FOR THE EXTRAORDINARY</span>

                <span>BMW M MOTORSPORT</span>

            </div>

        </section>

    </main>


    <script type="module" src="script.js"></script>

</body>

</html>
